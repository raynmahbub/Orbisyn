name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Node advisory database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install without scripts
        run: npm ci --ignore-scripts

      # What ships to a user: a high or critical advisory in a runtime
      # dependency fails the job. Development tooling is reported, not gated.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report all advisories
        if: always()
        run: npm audit || true
