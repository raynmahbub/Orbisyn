[package]
name = "orbisyn-desktop"
version = "0.1.0"
description = "Orbisyn cross-platform desktop client"
authors = ["Orbisyn contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
