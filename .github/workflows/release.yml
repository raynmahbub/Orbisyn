name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify before publishing
        run: npm run verify

      - name: Package the build
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release
          tar -czf "release/orbisyn-${tag}-gateway.tar.gz" -C services/gateway dist package.json
          tar -czf "release/orbisyn-${tag}-web.tar.gz" -C apps/web dist
          sha256sum release/*.tar.gz > "release/orbisyn-${tag}-SHA256SUMS"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" release/* \
            --title "$tag" \
            --generate-notes \
            --verify-tag
