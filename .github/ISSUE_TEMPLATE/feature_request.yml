name: Feature request
description: Suggest a capability, a source, or an improvement.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution — it makes the trade-offs visible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including doing nothing, and why that is not enough.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New source provider
        - Provider capability (artifacts, checksums, governance signals)
        - API or protocol (OSP)
        - Web client or PWA behaviour
        - Self-hosting and operations
        - Documentation
    validations:
      required: true
